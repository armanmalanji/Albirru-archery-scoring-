<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoring Albirru Archery Club</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1C3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Albirru PTQ">

<style>
:root {
--navy-blue: #0A1C3E;
--gold: #D4AF37;
--bg-light: #F0F4F8;
--text-dark: #2A3543;
--card-bg: #ffffff;
--input-bg: #ffffff;
--input-border: #D1D9E0;
--keypad-btn-bg: #E1E8ED;
}

body.dark-mode {
--bg-light: #1A1D21;
--text-dark: #E6EAF0;
--card-bg: #22262B;
--input-bg: #2B2F35;
--input-border: #3A4047;
--keypad-btn-bg: #3A4047;
--navy-blue: #0C234E;
}

body {
font-family: 'Poppins', 'Segoe UI', sans-serif;
background-color: var(--bg-light);
color: var(--text-dark);
margin: 0; padding: 0;
display: flex; flex-direction: column; min-height: 100vh;
transition: background-color 0.3s, color 0.3s;
}

header {
background-color: var(--navy-blue);
color: var(--gold);
padding: 12px 20px;
box-shadow: 0 4px 10px rgba(0,0,0,0.3);
display: flex;
align-items: center;
justify-content: space-between;
border-bottom: 2px solid var(--gold);
}

.header-content { display: flex; align-items: center; flex: 1; gap: 12px; }
.header-logo { height: 45px; width: auto; object-fit: contain; }
.header-title {
font-size: 22px; font-weight: 700; margin: 0;
text-shadow: 1px 1px 2px rgba(0,0,0,0.5); color: var(--gold); line-height: 1.2;
}

.header-controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.header-controls button {
background: transparent; border: 1px solid var(--gold);
color: var(--gold); font-size: 14px; padding: 5px 10px; font-weight: bold;
border-radius: 8px; cursor: pointer; margin: 0; width: auto; transition: 0.2s;
}
.header-controls button:hover { background-color: rgba(212, 175, 55, 0.1); }

@media (max-width: 380px) {
.header-logo { height: 35px; }
.header-title { font-size: 17px; }
.header-controls button { padding: 5px 8px; font-size: 12px; }
}

.container { padding: 20px; flex: 1; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; }
.card { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); margin-bottom: 20px; border-top: 5px solid var(--gold); transition: background-color 0.3s, box-shadow 0.3s; }

h3.section-title { margin-top: 0; color: var(--navy-blue); text-align: center; transition: color 0.3s; }
body.dark-mode h3.section-title { color: var(--gold); }

label { font-weight: 600; display: block; margin-top: 15px; color: var(--navy-blue); }
body.dark-mode label { color: var(--gold); }

input, select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid var(--input-border); border-radius: 10px; box-sizing: border-box; font-size: 16px; background: var(--input-bg); color: var(--text-dark); transition: border-color 0.3s, box-shadow 0.3s; }
input:focus, select:focus { border-color: var(--navy-blue); box-shadow: 0 0 5px rgba(10, 28, 62, 0.3); outline: none;}
body.dark-mode input:focus, body.dark-mode select:focus { border-color: var(--gold); box-shadow: 0 0 5px rgba(212, 175, 55, 0.3); }

/* --- STYLE TAB PEMANAH --- */
.archer-tabs { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 8px; margin-top: 10px; }
.archer-tabs::-webkit-scrollbar { height: 5px; }
.archer-tabs::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 10px; }
.archer-tab {
padding: 10px 18px; border: 1px solid var(--input-border); border-radius: 10px;
background: var(--input-bg); color: var(--text-dark); font-weight: 600;
white-space: nowrap; cursor: pointer; font-size: 15px; transition: all 0.2s;
}
.archer-tab:hover { background: #E1E8ED; }
body.dark-mode .archer-tab:hover { background: #3A4047; }
.archer-tab.active { background: var(--navy-blue); color: var(--gold); border-color: var(--navy-blue); box-shadow: 0 4px 8px rgba(10, 28, 62, 0.2); }
body.dark-mode .archer-tab.active { border-color: var(--gold); }

button.action-btn { background-color: var(--navy-blue); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; transition: background-color 0.2s, transform 0.1s; }
button.action-btn:hover { background-color: #11306C; }
button.action-btn:active { opacity: 0.8; transform: scale(0.98); }
body.dark-mode button.action-btn { background-color: var(--navy-blue); }
body.dark-mode button.action-btn:hover { background-color: #163B85; }

.btn-gold { background-color: var(--gold); color: #000; }
.btn-gold:hover { background-color: #E6C556; }
.btn-green { background-color: #4CAF50; color: white; margin-top: 10px;}
.btn-green:hover { background-color: #45a049; }
.btn-red { background-color: #f44336; color: white; margin-top: 10px;}
.btn-red:hover { background-color: #d32f2f; }

/* --- STYLE WARNA TARGET KEYPAD --- */
.keypad { display: grid; gap: 12px; margin-top: 20px; }
.keypad button { border: none; font-weight: 700; cursor: pointer; margin: 0; font-size: 20px; padding: 18px 0; border-radius: 10px; box-shadow: 0 3px 6px rgba(0,0,0,0.15); transition: transform 0.1s; }
.keypad button:active { transform: scale(0.95); }

.btn-target-yellow { background-color: #ffd700 !important; color: #000 !important; }
.btn-target-red { background-color: #ff4c4c !important; color: #fff !important; }
.btn-target-green { background-color: #4CAF50 !important; color: #fff !important; }
.btn-target-blue { background-color: #00bfff !important; color: #000 !important; }
.btn-target-black { background-color: #222222 !important; color: #fff !important; }
.btn-target-white { background-color: #ffffff !important; color: #000 !important; border: 1px solid #ccc !important; }
.btn-target-navy { background-color: var(--navy-blue) !important; color: #fff !important; }
.btn-target-m { background-color: #555555 !important; color: #fff !important; }

/* --- STYLE KOTAK ARROW --- */
.arrow-display { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; min-height: 40px; padding: 12px; background: rgba(10, 28, 62, 0.05); border-radius: 10px; }
body.dark-mode .arrow-display { background: rgba(255, 255, 255, 0.05); }

.arrow-box { position: relative; background: var(--input-bg); border: 2px solid var(--input-border); width: 44px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; border-radius: 8px; color: var(--text-dark); cursor: pointer; transition: all 0.1s ease-in-out; }
.arrow-box.selected { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); transform: scale(1.08); background-color: rgba(212, 175, 55, 0.1); }
.arrow-label { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #888; font-weight: 600; line-height: 1; }
body.dark-mode .arrow-label { color: #aaa; }
.arrow-val { margin-top: 6px; font-size: 16px; }

.live-total { text-align: right; font-weight: bold; color: var(--navy-blue); margin-top: 15px; font-size: 16px; }
body.dark-mode .live-total { color: var(--gold); }

/* --- STYLE LIVE LEADERBOARD (PAPAN SKOR LANGSUNG) --- */
.live-leaderboard-container { margin-top: 25px; padding: 15px; background: rgba(10, 28, 62, 0.03); border-radius: 10px; border: 1px solid var(--input-border); }
body.dark-mode .live-leaderboard-container { background: rgba(255, 255, 255, 0.03); border-color: var(--input-border); }
.live-leaderboard-container h4 { margin-top: 0; margin-bottom: 12px; color: var(--navy-blue); text-align: center; font-size: 16px; }
body.dark-mode .live-leaderboard-container h4 { color: var(--gold); }

.live-item-wrapper { border-bottom: 1px dashed var(--input-border); }
.live-item-wrapper:last-child { border-bottom: none; }
.live-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; font-size: 14px; transition: background-color 0.2s; cursor: pointer; border-radius: 6px;}
.live-row:hover { background-color: rgba(0,0,0,0.05); }
body.dark-mode .live-row:hover { background-color: rgba(255,255,255,0.05); }
.live-row.active-archer { background-color: rgba(212, 175, 55, 0.15); }
.live-rank { width: 30px; font-weight: bold; color: #666; }
body.dark-mode .live-rank { color: #aaa; }
.live-name { font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px;}
.live-score-val { font-weight: bold; color: var(--navy-blue); text-align: right; background: rgba(212, 175, 55, 0.3); padding: 3px 10px; border-radius: 12px;}
body.dark-mode .live-score-val { color: #111; background: var(--gold); }

/* Detail Rambahan di Live Score */
.live-detail-container { display: none; padding: 5px 10px 15px 40px; font-size: 13px; color: #555; }
body.dark-mode .live-detail-container { color: #bbb; }
.live-detail-container.show { display: block; animation: fadeIn 0.2s ease-in-out; }
.live-rambahan-item { display: flex; justify-content: space-between; margin-bottom: 6px; }

/* --- STYLE PERINGKAT ARROW TERBAIK --- */
.perf-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; color: var(--navy-blue); }
body.dark-mode .perf-title { color: var(--gold); }

.perf-rank-1 {
    font-size: 16px; 
    font-weight: 900; 
    color: var(--navy-blue); 
    margin-bottom: 6px; 
    background: rgba(212, 175, 55, 0.25); 
    padding: 6px 10px; 
    border-radius: 8px; 
    display: inline-block;
    border-left: 4px solid var(--gold);
}
body.dark-mode .perf-rank-1 { color: #fff; background: rgba(212, 175, 55, 0.3); }

.perf-rank-other { 
    font-size: 12px; 
    color: #666; 
    margin-bottom: 4px; 
    padding-left: 10px; 
}
body.dark-mode .perf-rank-other { color: #aaa; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

.history-item { padding: 15px; border-bottom: 1px solid var(--input-border); }
.history-item:last-child { border-bottom: none; }
.history-date { font-size: 14px; color: #666; margin-bottom: 5px; }
body.dark-mode .history-date { color: #aaa; }

.history-detail { font-size: 13px; color: #555; margin-left: 15px; margin-top: 6px; line-height: 1.5;}
body.dark-mode .history-detail { color: #bbb; }
.history-detail span { display: inline-block; margin-right: 12px; }

footer { text-align: center; padding: 20px; background: var(--navy-blue); color: var(--gold); font-size: 14px; font-weight: bold; border-top: 2px solid var(--gold);}

#scoring-section, #history-section { display: none; }
</style>
</head>
<body>

<header>
<div class="header-content">
<img src="icon-192.png" alt="Logo Albirru Archery" class="header-logo" onerror="this.style.display='none'">
<h1 class="header-title">Albirru archery</h1>
</div>
<div class="header-controls">
<button id="langBtn" onclick="toggleLanguage()">ID</button>
<button onclick="toggleTheme()">🌙</button>
</div>
</header>

<div class="container" id="setup-section">
<div class="card">
<h3 class="section-title" data-i18n="titleSettings">Pengaturan Pertandingan</h3>

<label data-i18n="labelCategory">Kategori Panahan</label>
<select id="categoryInput">
<option value="" disabled selected data-i18n="optCategory">Pilih Kategori</option>
<option value="Umum">Umum</option>
<option value="Junior">Junior</option>
<option value="Senior Anak">Senior Anak</option>
<option value="Senior Anak Ihwan">Senior Anak Ihwan</option>
<option value="Senior Anak Akhwat">Senior Anak Akhwat</option>
<option value="Senior Ihwan">Senior Ihwan</option>
<option value="Senior Akhwat">Senior Akhwat</option>
</select>

<label data-i18n="labelArchers">Nama Pemanah (Pisahkan koma)</label>
<input type="text" id="archersInput" data-i18n-placeholder="placeholderArchers" placeholder="Contoh: Ali, Umar">
<label data-i18n="labelDistance">Jarak (meter)</label>
<input type="number" id="distanceInput" data-i18n-placeholder="placeholderDistance" placeholder="Contoh: 20">
<label data-i18n="labelRambahan">Jumlah Rambahan</label>
<input type="number" id="rambahanInput" value="6" min="1">

<!-- FITUR NOMOR ARROW -->
<label data-i18n="labelArrowNumbers">Nomor Arrow (Opsional, pisahkan koma)</label>
<input type="text" id="arrowNumbersInput" data-i18n-placeholder="placeholderArrowNumbers" placeholder="Contoh: 1,3,5,6,7">
<label data-i18n="labelArrows" style="font-size: 13px; margin-top: 5px; font-weight: normal; color: #888;">Atau jumlah panah per rambahan (Maks 10):</label>
<input type="number" id="arrowsInput" value="3" min="1" max="10">

<button class="action-btn" onclick="startMatch()" data-i18n="btnStart">Mulai Skoring</button>
<button class="action-btn btn-gold" onclick="showHistory()" style="margin-top: 15px;" data-i18n="btnViewHistory">Lihat Histori Pertandingan</button>
</div>
</div>

<div class="container" id="history-section">
<div class="card">
<h3 class="section-title" data-i18n="titleHistory">Histori Pertandingan</h3>
<button class="action-btn btn-green" onclick="unduhExcel()" style="margin-top: 10px; width: 100%;" data-i18n="btnDownloadCSV">📊 Unduh Excel (Elegan)</button>
<div id="historyContent" style="margin-top: 20px;"></div>
<button class="action-btn" onclick="hideHistory()" style="margin-top: 20px;" data-i18n="btnBackSettings">Kembali ke Pengaturan</button>
</div>
</div>

<div class="container" id="scoring-section">
<div class="card">
<label data-i18n="labelCatDist">Kategori & Jarak</label>
<div style="font-size: 18px; font-weight: 600; color: var(--navy-blue);" id="matchInfoDisplay"></div>

<label data-i18n="labelArcher">Pilih Pemanah</label>
<div id="archerTabs" class="archer-tabs"></div>

<label data-i18n="labelRambahanScoring">Rambahan</label>
<select id="rambahanSelect" onchange="resetArrowIndex(); updateDisplay()"></select>

<div style="display:flex; justify-content:space-between; margin-top:15px; align-items:center;">
<label style="margin:0;" data-i18n="labelScoreRambahan">Skor Rambahan:</label>
<button id="keypadToggleBtn" onclick="toggleKeypad()" style="border: none; color: white; cursor: pointer; width:auto; margin:0; padding:6px 12px; font-size:12px; background:#555; border-radius:6px;">Ganti Mode Keypad</button>
</div>

<div style="font-size: 11px; color: #888; margin-top: 5px;">(Pilih kotak arrow di bawah untuk mengisi poin)</div>
<div class="arrow-display" id="arrowDisplay"></div>
<button class="action-btn" onclick="undoScore()" style="background:#ff9800; margin-top:5px; border-radius: 8px;" data-i18n="btnUndo">Hapus (Undo)</button>

<div class="live-total">
<span data-i18n="labelTotalScore">Total Skor Sementara:</span> <span id="liveTotalScore">0</span>
</div>

<!-- KEYPAD 10 RING (Standar) -->
<div class="keypad" id="keypadStandard" style="grid-template-columns: repeat(3, 1fr);">
<button class="btn-target-yellow" onclick="addScore('X')">X</button>
<button class="btn-target-yellow" onclick="addScore('10')">10</button>
<button class="btn-target-yellow" onclick="addScore('9')">9</button>
<button class="btn-target-red" onclick="addScore('8')">8</button>
<button class="btn-target-red" onclick="addScore('7')">7</button>
<button class="btn-target-blue" onclick="addScore('6')">6</button>
<button class="btn-target-blue" onclick="addScore('5')">5</button>
<button class="btn-target-black" onclick="addScore('4')">4</button>
<button class="btn-target-black" onclick="addScore('3')">3</button>
<button class="btn-target-white" onclick="addScore('2')">2</button>
<button class="btn-target-navy" onclick="addScore('1')">1</button>
<button class="btn-target-m" onclick="addScore('M')">M</button>
</div>

<!-- KEYPAD 6 RING (X, 10 - 5) -->
<div class="keypad" id="keypad6Ring" style="display:none; grid-template-columns: repeat(4, 1fr);">
<button class="btn-target-yellow" onclick="addScore('X')">X</button>
<button class="btn-target-yellow" onclick="addScore('10')">10</button>
<button class="btn-target-yellow" onclick="addScore('9')">9</button>
<button class="btn-target-red" onclick="addScore('8')">8</button>
<button class="btn-target-red" onclick="addScore('7')">7</button>
<button class="btn-target-blue" onclick="addScore('6')">6</button>
<button class="btn-target-blue" onclick="addScore('5')">5</button>
<button class="btn-target-m" onclick="addScore('M')">M</button>
</div>

<!-- KEYPAD 2 RING (Simple) -->
<div class="keypad" id="keypadSimple" style="display:none; grid-template-columns: repeat(3, 1fr);">
<button class="btn-target-white" onclick="addScore('2')" style="font-size:24px;">2</button>
<button class="btn-target-navy" onclick="addScore('1')" style="font-size:24px;">1</button>
<button class="btn-target-m" onclick="addScore('M')" style="font-size:24px;">M</button>
</div>

<!-- KEYPAD 3 RING (3 Merah, 2 Kuning, 1 Biru Muda) -->
<div class="keypad" id="keypad3Ring" style="display:none; grid-template-columns: repeat(4, 1fr);">
<button class="btn-target-red" onclick="addScore('3')" style="font-size:24px;">3</button>
<button class="btn-target-yellow" onclick="addScore('2')" style="font-size:24px;">2</button>
<button class="btn-target-blue" onclick="addScore('1')" style="font-size:24px;">1</button>
<button class="btn-target-m" onclick="addScore('M')" style="font-size:24px;">M</button>
</div>

<!-- KEYPAD 6 RING CUSTOM -->
<div class="keypad" id="keypad6RingColor" style="display:none; grid-template-columns: repeat(4, 1fr);">
<button class="btn-target-yellow" onclick="addScore('6+')" style="font-size:24px;">6+</button>
<button class="btn-target-yellow" onclick="addScore('6')" style="font-size:24px;">6</button>
<button class="btn-target-red" onclick="addScore('5')" style="font-size:24px;">5</button>
<button class="btn-target-green" onclick="addScore('4')" style="font-size:24px;">4</button>
<button class="btn-target-white" onclick="addScore('3')" style="font-size:24px;">3</button>
<button class="btn-target-white" onclick="addScore('2')" style="font-size:24px;">2</button>
<button class="btn-target-blue" onclick="addScore('1')" style="font-size:24px;">1</button>
<button class="btn-target-m" onclick="addScore('M')" style="font-size:24px;">M</button>
</div>

<!-- LIVE LEADERBOARD (Papan Skor Langsung) -->
<div class="live-leaderboard-container">
<h4 data-i18n="titleLiveScore" style="margin-bottom: 15px;">🏆 Papan Skor Langsung (Live)</h4>
<div style="font-size: 11px; text-align: center; color: #888; margin-top: -10px; margin-bottom: 10px;">
(Klik nama pemanah untuk melihat detail performa arrow)
</div>
<div id="liveLeaderboardContent"></div>
</div>

<hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--input-border);">
<button class="action-btn btn-gold" onclick="shareWhatsApp()" data-i18n="btnShareWA">📱 Share WhatsApp (Detail)</button>
<button class="action-btn btn-green" onclick="finishAndSaveMatch()" data-i18n="btnFinishSave">Selesai & Simpan Histori</button>
<button class="action-btn btn-red" onclick="resetMatch()" data-i18n="btnDelete">Hapus Tanpa Simpan</button>
</div>
</div>

<footer data-i18n="footerText">Dibuat oleh Abu Zaid</footer>

let archers = []; let distance = 0; let maxRambahan = 0; let maxArrows = 0; let scores = {};
let keypadMode = 0;
let selectedCategory = "";
let currentArcher = "";
let currentLang = 'id';
let expandedLiveArchers = new Set(); 

let arrowSequence = []; 
let currentArrowIndex = 0; 

const storageKey = 'albirru_scoring_data_v3'; 
const historyKey = 'albirru_match_history';

window.onload = function() {
if(localStorage.getItem('albirru_theme') === 'dark') { document.body.classList.add('dark-mode'); }
currentLang = localStorage.getItem('albirru_lang') || 'id';
applyLanguage();

const savedData = localStorage.getItem(storageKey);
if (savedData) {
const data = JSON.parse(savedData);
archers = data.archers; distance = data.distance; maxRambahan = data.maxRambahan; maxArrows = data.maxArrows; scores = data.scores; selectedCategory = data.selectedCategory;
currentArcher = data.currentArcher || archers[0];
arrowSequence = data.arrowSequence || Array.from({length: maxArrows}, (_, i) => (i + 1).toString());
currentArrowIndex = data.currentArrowIndex || 0;

setupTabsAndDropdowns();
document.getElementById('setup-section').style.display = 'none';
document.getElementById('scoring-section').style.display = 'block';
updateMatchInfo(); updateDisplay();
}
};

function toggleTheme() { document.body.classList.toggle('dark-mode'); localStorage.setItem('albirru_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); }

function toggleLanguage() {
currentLang = currentLang === 'id' ? 'jv' : 'id';
localStorage.setItem('albirru_lang', currentLang);
applyLanguage();
if (document.getElementById('history-section').style.display === 'block') { showHistory(); }
}

function applyLanguage() {
const txtData = translations[currentLang];
document.querySelectorAll('[data-i18n]').forEach(el => {
const key = el.getAttribute('data-i18n');
if (txtData[key]) el.innerText = txtData[key];
});
document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
const key = el.getAttribute('data-i18n-placeholder');
if (txtData[key]) el.placeholder = txtData[key];
});
document.getElementById('langBtn').innerText = currentLang === 'id' ? 'Bhs: ID' : 'Basa: JV';
updateToggleBtnText();
}

function updateToggleBtnText() {
let modeName = keypadMode === 0 ? '10 Ring' :
(keypadMode === 1 ? '6 Ring (X-5)' :
(keypadMode === 2 ? '2 Ring' :
(keypadMode === 3 ? '3 Ring' : '6 Ring (Warna)')));
document.getElementById('keypadToggleBtn').innerText = translations[currentLang]['btnToggleKeypad'] + ' (' + modeName + ')';
}

function t(key) { return translations[currentLang][key]; }

function saveData() { 
localStorage.setItem(storageKey, JSON.stringify({ 
archers, distance, maxRambahan, maxArrows, scores, selectedCategory, currentArcher, arrowSequence, currentArrowIndex 
})); 
}

function startMatch() {
const archersStr = document.getElementById('archersInput').value; distance = document.getElementById('distanceInput').value;
maxRambahan = parseInt(document.getElementById('rambahanInput').value); selectedCategory = document.getElementById('categoryInput').value;
const customArrowStr = document.getElementById('arrowNumbersInput').value.trim();

if (!selectedCategory || !archersStr || !distance || !maxRambahan) { alert(t('alertIncomplete')); return; }

if (customArrowStr) {
arrowSequence = customArrowStr.split(',').map(s => s.trim()).filter(s => s);
maxArrows = arrowSequence.length;
} else {
maxArrows = parseInt(document.getElementById('arrowsInput').value);
if (!maxArrows) { alert(t('alertIncomplete')); return; }
arrowSequence = Array.from({length: maxArrows}, (_, i) => (i + 1).toString());
}

archers = archersStr.split(',').map(a => a.trim()).filter(a => a);
archers.forEach(archer => { 
scores[archer] = Array.from({length: maxRambahan}, () => new Array(maxArrows).fill(null)); 
});

currentArcher = archers[0];
currentArrowIndex = 0;
expandedLiveArchers.clear(); 

setupTabsAndDropdowns(); document.getElementById('setup-section').style.display = 'none'; document.getElementById('scoring-section').style.display = 'block';
saveData(); updateMatchInfo(); updateDisplay();
}

function selectArcher(archerName) {
currentArcher = archerName;
resetArrowIndex();
saveData(); renderTabs(); updateDisplay();
}

function renderTabs() {
const tabsContainer = document.getElementById('archerTabs');
tabsContainer.innerHTML = '';
archers.forEach(archer => {
let btn = document.createElement('button');
btn.className = 'archer-tab' + (archer === currentArcher ? ' active' : '');
btn.innerText = archer;
btn.onclick = () => selectArcher(archer);
tabsContainer.appendChild(btn);
});
}

function setupTabsAndDropdowns() {
renderTabs();
const rambahanSelect = document.getElementById('rambahanSelect');
rambahanSelect.innerHTML = '';
for (let i = 0; i < maxRambahan; i++) { let opt = document.createElement('option'); opt.value = i; opt.text = `Rambahan ${i + 1}`; rambahanSelect.appendChild(opt); }
}

function updateMatchInfo() { document.getElementById('matchInfoDisplay').innerText = `${selectedCategory} - ${distance}m`; }

function toggleKeypad() {
keypadMode = (keypadMode + 1) % 5;
document.getElementById('keypadStandard').style.display = keypadMode === 0 ? 'grid' : 'none';
document.getElementById('keypad6Ring').style.display = keypadMode === 1 ? 'grid' : 'none';
document.getElementById('keypadSimple').style.display = keypadMode === 2 ? 'grid' : 'none';
document.getElementById('keypad3Ring').style.display = keypadMode === 3 ? 'grid' : 'none';
document.getElementById('keypad6RingColor').style.display = keypadMode === 4 ? 'grid' : 'none';
updateToggleBtnText(); updateDisplay();
}

function resetArrowIndex() {
const archer = currentArcher; const rambahanIdx = parseInt(document.getElementById('rambahanSelect').value);
let nextEmpty = scores[archer][rambahanIdx].indexOf(null);
currentArrowIndex = nextEmpty !== -1 ? nextEmpty : 0;
}

function selectArrowBox(index) { currentArrowIndex = index; updateDisplay(); }

function addScore(val) {
const archer = currentArcher; const rambahanIdx = parseInt(document.getElementById('rambahanSelect').value);
let rambahanData = scores[archer][rambahanIdx];

if (rambahanData[currentArrowIndex] !== null) {
let nextEmpty = rambahanData.indexOf(null);
if (nextEmpty !== -1) { currentArrowIndex = nextEmpty; } else { alert(t('alertFull')); return; }
}

rambahanData[currentArrowIndex] = val;
saveData();

let nextEmptyAfter = rambahanData.indexOf(null);
if (nextEmptyAfter !== -1) {
currentArrowIndex = nextEmptyAfter;
} else {
setTimeout(() => { let msg = t('alertNoticeFull').replace('{r}', rambahanIdx + 1).replace('{a}', archer); alert(msg); }, 150);
}
updateDisplay();
}

function undoScore() {
const archer = currentArcher; const rambahanIdx = parseInt(document.getElementById('rambahanSelect').value);
let rambahanData = scores[archer][rambahanIdx];

if (rambahanData[currentArrowIndex] !== null) {
rambahanData[currentArrowIndex] = null;
} else {
for (let i = maxArrows - 1; i >= 0; i--) {
if (rambahanData[i] !== null) { rambahanData[i] = null; currentArrowIndex = i; break; }
}
}
saveData(); updateDisplay();
}

function updateDisplay() {
const archer = currentArcher; const rambahanIdx = parseInt(document.getElementById('rambahanSelect').value);
const display = document.getElementById('arrowDisplay'); display.innerHTML = '';
let currentTotal = 0;
let rambahanData = scores[archer][rambahanIdx];

if (currentArrowIndex >= maxArrows) currentArrowIndex = 0;

for (let i = 0; i < maxArrows; i++) {
let val = rambahanData[i];
let box = document.createElement('div');
box.className = 'arrow-box';
if (i === currentArrowIndex) box.classList.add('selected');
box.onclick = () => selectArrowBox(i);

let label = document.createElement('span');
label.className = 'arrow-label'; label.innerText = '#' + arrowSequence[i]; box.appendChild(label);

let valDiv = document.createElement('div');
valDiv.className = 'arrow-val'; valDiv.innerText = val !== null ? val : '';

if (val !== null) {
if (keypadMode === 3) {
if (val === '3') { box.style.background = '#ff4c4c'; box.style.color = '#fff'; box.style.borderColor = '#ff4c4c'; }
else if (val === '2') { box.style.background = '#ffd700'; box.style.color = '#000'; box.style.borderColor = '#ffd700'; }
else if (val === '1') { box.style.background = '#00bfff'; box.style.color = '#000'; box.style.borderColor = '#00bfff'; }
else if (val === 'M') { box.style.background = '#555'; box.style.color = '#fff'; box.style.borderColor = '#555'; }
}
else if (keypadMode === 4) {
if (val === '6+' || val === '6') { box.style.background = '#ffd700'; box.style.color = '#000'; box.style.borderColor = '#ffd700'; }
else if (val === '5') { box.style.background = '#ff4c4c'; box.style.color = '#fff'; box.style.borderColor = '#ff4c4c'; }
else if (val === '4') { box.style.background = '#4CAF50'; box.style.color = '#fff'; box.style.borderColor = '#4CAF50'; }
else if (val === '3' || val === '2') { box.style.background = '#fff'; box.style.color = '#000'; box.style.borderColor = '#999'; }
else if (val === '1') { box.style.background = '#00bfff'; box.style.color = '#000'; box.style.borderColor = '#00bfff'; }
else if (val === 'M') { box.style.background = '#555'; box.style.color = '#fff'; box.style.borderColor = '#555'; }
}
else {
if (['X', '10', '9'].includes(val)) { box.style.background = '#ffd700'; box.style.color = '#000'; box.style.borderColor = '#ffd700'; }
else if (['8', '7'].includes(val)) { box.style.background = '#ff4c4c'; box.style.color = '#fff'; box.style.borderColor = '#ff4c4c'; }
else if (['6', '5'].includes(val)) { box.style.background = '#00bfff'; box.style.color = '#000'; box.style.borderColor = '#00bfff'; }
else if (['4', '3'].includes(val)) { box.style.background = '#222'; box.style.color = '#fff'; box.style.borderColor = '#222'; }
else if (val === '2') { box.style.background = '#fff'; box.style.color = '#000'; box.style.borderColor = '#999'; }
else if (val === '1') { box.style.background = 'var(--navy-blue)'; box.style.color = '#fff'; box.style.borderColor = 'var(--navy-blue)'; }
else if (val === 'M') { box.style.background = '#555'; box.style.color = '#fff'; box.style.borderColor = '#555'; }
}
} else { box.style.background = 'transparent'; }

box.appendChild(valDiv); display.appendChild(box);
}

scores[archer].forEach(rambahan => { rambahan.forEach(s => { if(s !== null) currentTotal += calculateScoreValue(s); }); });
document.getElementById('liveTotalScore').innerText = currentTotal;
updateLiveLeaderboard();
}

function calculateScoreValue(val) {
if (val === 'X') return 10;
if (val === '6+') return 6;
if (val === 'M' || val === null) return 0;
return parseInt(val) || 0;
}

function generateReportData() {
let report = [];
archers.forEach(archer => {
let totalSkor = 0, totalX = 0;
scores[archer].forEach(rambahan => { 
rambahan.forEach(s => { 
if (s !== null) { totalSkor += calculateScoreValue(s); if (s === 'X' || s === '6+') totalX++; }
}); 
});
report.push({ name: archer, skor: totalSkor, x: totalX });
});
report.sort((a, b) => b.skor - a.skor || b.x - a.x); return report;
}

// --- FUNGSI MENGHITUNG DAN RENDER PERFORMA ARROW ---
function getArrowPerformanceHTML(archerName, matchScores, matchSeq) {
let perf = {};
matchSeq.forEach((arrNum, i) => { perf[i] = { total: 0, count: 0 }; });

matchScores[archerName].forEach(rambahan => {
rambahan.forEach((val, i) => {
if (val !== null) {
perf[i].total += calculateScoreValue(val);
perf[i].count += 1;
}
});
});

let grouped = {};
let hasAnyShot = false;
for (let i in perf) {
if (perf[i].count > 0) hasAnyShot = true;
let s = perf[i].total;
if (!grouped[s]) grouped[s] = [];
grouped[s].push(matchSeq[i]);
}

if (!hasAnyShot) return '';

let sortedScores = Object.keys(grouped).map(Number).sort((a,b) => b - a);
let html = `<div style="margin-top: 15px; padding-top: 12px; border-top: 1px dashed var(--input-border);">
<div class="perf-title">🎯 Analisis Performa Arrow:</div>`;

sortedScores.forEach((score, idx) => {
let arrowsStr = grouped[score].map(a => `#${a}`).join(', ');
if (idx === 0) {
html += `<div class="perf-rank-1">🏆 Total Poin ${score}: Arrow ${arrowsStr}</div><br>`;
} else {
html += `<div class="perf-rank-other">Total Poin ${score}: Arrow ${arrowsStr}</div>`;
}
});
html += `</div>`;
return html;
}

function toggleLiveDetail(archerName) {
if(expandedLiveArchers.has(archerName)) { expandedLiveArchers.delete(archerName); } 
else { expandedLiveArchers.add(archerName); }
updateLiveLeaderboard();
}

function updateLiveLeaderboard() {
const container = document.getElementById('liveLeaderboardContent');
if (!container) return;

const rankData = generateReportData();
let html = '';

rankData.forEach((data, index) => {
let activeClass = (data.name === currentArcher) ? 'active-archer' : '';
let isExpanded = expandedLiveArchers.has(data.name);

html += `<div class="live-item-wrapper">`;
html += `
<div class="live-row ${activeClass}" onclick="toggleLiveDetail('${data.name}')">
<div class="live-rank">#${index + 1}</div>
<div class="live-name">
${data.name}
<span style="font-size:10px; color:#999;">${isExpanded ? '▲' : '▼'}</span>
</div>
<div class="live-score-val">${data.skor} <span style="font-size:11px; font-weight:normal;">(X:${data.x})</span></div>
</div>`;

html += `<div class="live-detail-container ${isExpanded ? 'show' : ''}">`;

let hasData = false;
if (scores[data.name]) {
scores[data.name].forEach((rambahan, rIdx) => {
let validScores = rambahan.filter(v => v !== null);
if (validScores.length > 0) {
hasData = true;
let subTotal = validScores.reduce((sum, val) => sum + calculateScoreValue(val), 0);
let detailStr = rambahan.map((v, i) => v !== null ? `[#${arrowSequence[i]}:${v}]` : '').filter(v => v).join(' ');
html += `
<div class="live-rambahan-item">
<span><b>R${rIdx + 1}:</b> ${detailStr}</span>
<span><b>${subTotal}</b></span>
</div>`;
}
});

// Panggil fungsi Analisis Arrow di Live Score
if (hasData) {
html += getArrowPerformanceHTML(data.name, scores, arrowSequence);
}
}

if (!hasData) { html += `<div style="text-align:center; color:#999; font-style:italic;">Belum ada tembakan</div>`; }

html += `</div></div>`; 
});
container.innerHTML = html;
}

// FUNGSI BANTU UNTUK WHATSAPP TEXT
function getArrowPerformanceTextWA(archerName, matchScores, matchSeq) {
let perf = {};
matchSeq.forEach((arrNum, i) => { perf[i] = { total: 0, count: 0 }; });
matchScores[archerName].forEach(rambahan => {
rambahan.forEach((val, i) => { if (val !== null) { perf[i].total += calculateScoreValue(val); perf[i].count += 1; } });
});
let grouped = {}; let hasAnyShot = false;
for (let i in perf) {
if (perf[i].count > 0) hasAnyShot = true;
let s = perf[i].total;
if (!grouped[s]) grouped[s] = []; grouped[s].push(matchSeq[i]);
}
if (!hasAnyShot) return '';
let sortedScores = Object.keys(grouped).map(Number).sort((a,b) => b - a);
if (sortedScores.length > 0) {
let topScore = sortedScores[0];
let arrowsStr = grouped[topScore].map(a => `#${a}`).join(', ');
return `🎯 *Best Arrow:* ${arrowsStr} (Total ${topScore} Poin)\n`;
}
return '';
}

<th style="background-color: #0A1C3E; color: #D4AF37; border: 1px solid #000; padding: 5px 15px;">Peringkat</th>
<th style="background-color: #0A1C3E; color: #D4AF37; border: 1px solid #000; padding: 5px 15px;">Nama Pemanah</th>
<th style="background-color: #0A1C3E; color: #D4AF37; border: 1px solid #000; padding: 5px 15px;">Skor Akhir</th>
<th style="background-color: #0A1C3E; color: #D4AF37; border: 1px solid #000; padding: 5px 15px;">Total X</th>`;

for(let i = 1; i <= maxR; i++) { html += `<th style="background-color: #0A1C3E; color: #D4AF37; border: 1px solid #000; padding: 5px 15px;">Rambahan ${i}</th>`; }
html += `</tr>`;

history.forEach((m, hIdx) => {
let mSeq = m.arrowSequence || Array.from({length: 10}, (_, i) => (i + 1).toString());
m.results.forEach((r, idx) => {
let bgRow = (hIdx + idx) % 2 === 0 ? '#F9F9F9' : '#FFFFFF';
html += `
<tr style="height: 35px;">
<td style="background-color: ${bgRow}; border: 1px solid #000; padding: 5px 10px; text-align: center;">${m.date}</td>
<td style="background-color: ${bgRow}; border: 1px solid #000; padding: 5px 10px; text-align: center;">${m.category}</td>
<td style="background-color: ${bgRow}; border: 1px solid #000; padding: 5px 10px; text-align: center;">${m.distance}m</td>
<td style="background-color: #E1E8ED; border: 1px solid #000; padding: 5px 10px; text-align: center; font-weight: bold;">#${idx + 1}</td>
<td style="background-color: ${bgRow}; border: 1px solid #000; padding: 5px 10px; text-align: center; font-weight: bold;">${r.name}</td>
<td style="background-color: #FFF3CD; border: 1px solid #000; padding: 5px 10px; text-align: center; font-weight: bold; color: #856404;">${r.skor}</td>
<td style="background-color: ${bgRow}; border: 1px solid #000; padding: 5px 10px; text-align: center;">${r.x}</td>`;

for(let i = 0; i < maxR; i++) {
if (m.scores && m.scores[r.name] && m.scores[r.name][i]) {
let validScores = m.scores[r.name][i].filter(v => v !== null);
let subTotal = validScores.reduce((sum, val) => sum + calculateScoreValue(val), 0);
if (validScores.length > 0) {
let detailStr = m.scores[r.name][i].map((v, iSeq) => v !== null ? `A${mSeq[iSeq] || iSeq+1}:${v}` : '').filter(v => v).join(', ');
html += `<td style="background-color: ${bgRow}; border: 1px solid #000; padding: 5px 10px; text-align: center;">${detailStr} <b>(${subTotal})</b></td>`;
} else { html += `<td style="background-color: ${bgRow}; border: 1px solid #000; padding: 5px 10px; text-align: center;">-</td>`; }
} else { html += `<td style="background-color: ${bgRow}; border: 1px solid #000; padding: 5px 10px; text-align: center;">-</td>`; }
}
html += `</tr>`;
});
});
html += `</table></body></html>`;

const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
const link = document.createElement("a");
const url = URL.createObjectURL(blob);
link.setAttribute("href", url);
link.setAttribute("download", "Histori_Albirru_Archery.xls");
link.style.visibility = 'hidden';
document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
</script>
</body>
</html>
